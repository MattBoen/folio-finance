services:
  - type: web
    name: folio-finance-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: folio-finance-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PLAID_CLIENT_ID
        value: placeholder
      - key: PLAID_SECRET
        value: placeholder
      - key: PLAID_ENV
        value: sandbox
      - key: APPLE_BUNDLE_ID
        value: com.mattboen.foliofinance
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  - name: folio-finance-db
    plan: free
    databaseName: finance_client
