services:
  - type: web
    name: finance-client-api
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: finance-client-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false
      - key: PLAID_ENV
        value: sandbox
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: worker
    name: finance-client-worker
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/jobs/worker.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-client-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        fromService:
          name: finance-client-api
          type: web
          property: envVarValue
          envVarKey: JWT_ACCESS_SECRET
      - key: ENCRYPTION_KEY
        fromService:
          name: finance-client-api
          type: web
          property: envVarValue
          envVarKey: ENCRYPTION_KEY
      - key: PLAID_CLIENT_ID
        sync: false
      - key: PLAID_SECRET
        sync: false

databases:
  - name: finance-client-db
    plan: starter
    databaseName: finance_client
